[project]
name = "rag-api"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
rerank = ["fastembed>=0.5,<1"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
py-modules = ["app"]
[tool.setuptools.packages.find]
include = ["rag*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires migrated PostgreSQL and a restricted runtime role"]
[tool.ruff]
line-length = 100
